# workbench.shuncheng.xin — 全域自媒体工作台
# 静态 SPA + AI 代理反代（原生 Node @ 127.0.0.1:3790）
# 部署：scp 到 /etc/nginx/conf.d/workbench.shuncheng.xin.conf → nginx -t && systemctl reload nginx

server {
    server_name workbench.shuncheng.xin;

    root /var/www/workbench.shuncheng.xin;
    index index.html;

    # workbench AI 代理（同源 /api/* → 后端 3790）
    # 注意：proxy_pass 不带尾斜杠，请求 /api/ai/generate 会被「原样」转发给后端，
    # 与 server.js 的 /api/ai/generate 路由精确匹配；若写成 3790/ 会剥掉 /api 前缀
    # → 后端收到 /ai/generate 而 404。
    location /api/ {
        proxy_pass http://127.0.0.1:3790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/ai/stream 为 SSE：必须关缓冲，否则增量被缓冲、前端像卡死
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Connection "";
    }

    # SPA 兜底：非静态路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/workbench.shuncheng.xin/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/workbench.shuncheng.xin/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = workbench.shuncheng.xin) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name workbench.shuncheng.xin;
    return 404; # managed by Certbot
}